<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Compras</title>
<meta name="description" content="Anotar qué busco para vender, calcular costos y guardar locales">
<meta name="theme-color" content="#f7f3ec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Compras">
<style>
:root{
  --bg:#f7f3ec; --card:#fff; --inset:#efe8dc; --ink:#26221d; --muted:#6f665b; --line:#e3d9ca;
  --acento:#1f7a5c; --acento-soft:#dcefe6; --rojo:#b8402f; --ambar:#a8650a;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:19px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(88px + env(safe-area-inset-bottom))}
header{padding:20px 16px 8px;max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:28px;margin:0}
main{max-width:640px;margin:0 auto;padding:0 16px}
.vacio{color:var(--muted);text-align:center;padding:32px 8px}
.tarjeta{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.tarjeta h3{margin:0 0 4px;font-size:21px}
.tarjeta p{margin:4px 0;color:var(--muted)}
.fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fila.fin{justify-content:flex-end;margin-top:10px}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.cifra{background:var(--inset);border-radius:12px;padding:8px 12px}
.cifra small{display:block;color:var(--muted);font-size:15px}
.cifra b{font-size:21px}
.verde{color:var(--acento)} .rojo{color:var(--rojo)}
.chip{display:inline-block;font-size:15px;padding:2px 10px;border-radius:99px;background:var(--inset);color:var(--muted)}
.chip.ok{background:var(--acento-soft);color:var(--acento)}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;min-height:48px}
button.grande{width:100%;background:var(--acento);border-color:var(--acento);color:#fff;font-weight:700;font-size:20px;margin:8px 0}
button.chico{min-height:40px;padding:6px 12px;font-size:16px}
button.borrar{color:var(--rojo)}
label{display:block;margin:12px 0 4px;font-weight:600}
input,textarea,select{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:3px solid var(--acento-soft);border-color:var(--acento)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.buscar{margin:4px 0 4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;border-radius:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;min-height:72px;font-size:14px;color:var(--muted)}
nav button span{font-size:26px;line-height:1}
nav button.activo{color:var(--acento);font-weight:700;background:var(--acento-soft)}
dialog{border:0;border-radius:20px;padding:0;width:min(600px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{padding:18px 16px}
dialog h2{margin:0 0 4px}
.resultado{background:var(--card);border:2px solid var(--acento);border-radius:16px;padding:14px 16px;margin:16px 0}
.resultado p{margin:6px 0}
.resultado b{font-size:22px}
.ayuda{color:var(--muted);font-size:16px;margin:4px 0}
.atajos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pie{color:var(--muted);font-size:15px;text-align:center;margin:28px 0 8px}
.pie button{font-size:15px;min-height:40px;margin:4px}
.nav-frida{height:30px;width:auto;margin-top:-4px}
.bienvenida{text-align:center;margin:8px 0}
.bienvenida img{width:130px;height:auto}
.bienvenida p{margin:6px 0;font-size:20px}
.fila-asis{display:flex;gap:8px;align-items:flex-start}
.fila-asis>img{width:40px;height:52px;object-fit:cover;object-position:top;flex:none;margin-top:10px}
.fila-asis .msj{margin:10px 0}
.segmento{display:grid;grid-template-columns:1fr 1fr;background:var(--inset);border-radius:14px;padding:4px;gap:4px;margin:0 0 6px}
.segmento button{border:0;background:none;min-height:42px;font-size:17px;color:var(--muted);border-radius:10px}
.segmento button.activo{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.nota{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0}
.nota>p,.lista-gasto{margin:0;font-size:17px;line-height:1.35;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lista-gasto{color:var(--muted);font-size:15px;-webkit-line-clamp:2;margin-top:2px}
.nota.abierta>p,.lista-gasto.abierta{display:block}
.nota-pie{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:14px;color:var(--muted)}
.nota-pie>span{flex:1}
.mini{min-height:36px;min-width:40px;padding:2px 8px;font-size:16px;border:0;background:var(--inset);border-radius:10px}
.mini.texto{font-size:14px;color:var(--acento);font-weight:700}
.gasto.pendiente{border-left:4px solid var(--rojo)}
.resumen-gastos{background:var(--card);border:2px solid var(--acento);border-radius:16px;padding:10px 14px;margin:8px 0}
.resumen-gastos>p{margin:0;font-weight:700}
.subtitulo{font-size:17px;color:var(--muted);margin:20px 0 4px}
label.check{display:flex;align-items:center;gap:10px;font-size:19px;margin:16px 0 4px}
label.check input{width:26px;height:26px;flex:none}
.suave{color:var(--muted);font-weight:400}
.por-tipo{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:15px;color:var(--muted)}
.por-tipo b{color:var(--ink)}
#avisoFrida{width:44px;height:58px;object-fit:cover;object-position:top;flex:none}
.aviso{width:min(420px,calc(100% - 32px))}
.aviso form{padding:20px 18px 14px}
.aviso p{margin:0 0 12px;font-size:20px}
.aviso .si{background:var(--acento);border-color:var(--acento);color:#fff;font-weight:700}
.aviso .si.peligro{background:var(--rojo);border-color:var(--rojo)}
.barra-charlas{display:flex;gap:8px;margin:0 0 8px}
.barra-charlas button{flex:1;min-height:44px;font-size:16px}
.charla h3{font-size:19px;margin:0 0 2px;word-break:break-word}
.charla.actual{border:2px solid var(--acento)}
@keyframes golpe{0%,100%{transform:none}12%{transform:translate(-7px,2px)}24%{transform:translate(6px,-2px)}36%{transform:none}52%{transform:translate(-7px,2px)}64%{transform:translate(6px,-2px)}76%{transform:none}}
body.golpe main{animation:golpe .55s ease-out}
.toc{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;display:flex;align-items:center;gap:10px;
  background:var(--card);border:2px solid var(--acento);border-radius:18px;padding:8px 14px;box-shadow:0 6px 24px rgba(0,0,0,.18);
  font-size:20px;font-weight:700;z-index:5;animation:aparece .3s ease-out}
.toc img{width:44px;height:56px;object-fit:cover;object-position:top}
@keyframes aparece{from{transform:translateY(16px) scale(.9)}to{transform:none}}
body.en-chat{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
.msj{max-width:88%;padding:10px 14px;border-radius:16px;margin:10px 0;white-space:pre-wrap;word-wrap:break-word}
.msj.yo{margin-left:auto;background:var(--acento);color:#fff;border-bottom-right-radius:4px}
.msj.asis{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msj.pensando{color:var(--muted);font-style:italic}
.propuesta{background:var(--acento-soft);border-radius:12px;padding:10px 12px;margin:8px 0 0}
.propuesta p{margin:0 0 8px;color:var(--ink)}
.propuesta button{min-height:44px}
.fuentes{border-top:1px solid var(--line);margin-top:10px;padding-top:8px;font-size:16px}
.fuentes p{margin:4px 0;color:var(--muted)}
.fuentes a{display:block;margin:4px 0;color:var(--acento);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fuentes .google{display:inline-block;margin-top:6px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;white-space:normal}
.sugerencias{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.sugerencias button{text-align:left}
.escribir{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);padding:10px 16px}
.escribir>div{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.escribir textarea{min-height:52px;max-height:140px;padding:12px}
.escribir button{flex:none;width:52px;height:52px;padding:0;font-size:22px}
.escribir .enviar{background:var(--acento);border-color:var(--acento);color:#fff}
.escribir .mic.grabando{background:var(--rojo);border-color:var(--rojo);color:#fff}
</style>
</head>
<body>
<header><h1 id="titulo">Notas</h1></header>
<main id="vista"></main>

<nav id="menu">
  <button data-tab="notas"><span>📝</span>Notas</button>
  <button data-tab="productos"><span>📦</span>Busco</button>
  <button data-tab="calcular"><span>🧮</span>Calcular</button>
  <button data-tab="locales"><span>🏪</span>Locales</button>
  <button data-tab="asistente"><span><img src="frida.svg" alt="" class="nav-frida"></span>Frida</button>
</nav>

<dialog id="modal"><form method="dialog" id="formModal"></form></dialog>
<dialog id="aviso" class="aviso"><form method="dialog">
  <div class="fila" style="flex-wrap:nowrap;align-items:flex-start"><img id="avisoFrida" src="frida.svg" alt="" hidden><p id="avisoTexto"></p></div>
  <input id="avisoCampo" hidden>
  <div class="fila fin"><button value="no" id="avisoNo">Cancelar</button><button value="si" id="avisoSi" class="si">Sí</button></div>
</form></dialog>
<input type="file" id="archivo" accept="application/json" hidden>

<script>
const CLAVE = 'mis-compras-v1';
const TITULOS = { notas: 'Notas', productos: 'Lo que busco', calcular: 'Calcular', locales: 'Locales', asistente: 'Frida, tu ayudante' };
const API = 'https://itultpcdafpxpgtblgfb.supabase.co/functions/v1/mis-compras';
let datos = cargar();
let tab = leerTab();
let filtro = '';
const calc = { bulto: '', unidades: '', venta: '' };

function cargar() {
  try {
    const d = JSON.parse(localStorage.getItem(CLAVE));
    if (d) return { notas: d.notas || [], productos: d.productos || [], locales: d.locales || [], gastos: d.gastos || [] };
  } catch {}
  return { notas: [], productos: [], locales: [], gastos: [] };
}
function guardar() {
  try { localStorage.setItem(CLAVE, JSON.stringify(datos)); } catch { avisar('No se pudo guardar en este teléfono.'); }
}
function leerTab() {
  try { const t = localStorage.getItem(CLAVE + '-tab'); if (TITULOS[t]) return t; } catch {}
  return 'notas';
}
const id = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const num = v => { const n = parseFloat(String(v).replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const plata = n => '$' + n.toLocaleString('es-AR', { maximumFractionDigits: n < 100 ? 2 : 0 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fecha = t => new Date(t).toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });

function cuentas(bulto, unidades, venta) {
  const b = num(bulto), u = num(unidades) || 1, v = num(venta);
  const costo = b / u;
  const ganUnidad = v - costo;
  return { costo, u, v, ganUnidad, ganBulto: ganUnidad * u, porc: costo > 0 ? ganUnidad / costo * 100 : 0, hay: b > 0 };
}

function cambiarTab(t) {
  tab = t; filtro = '';
  try { localStorage.setItem(CLAVE + '-tab', t); } catch {}
  dibujar(); scrollTo(0, 0);
}

function dibujar() {
  document.getElementById('titulo').textContent = tab === 'notas' && subNotas === 'gastos' ? 'Gastos casa' : TITULOS[tab];
  document.querySelectorAll('#menu button').forEach(b => b.classList.toggle('activo', b.dataset.tab === tab));
  const v = document.getElementById('vista');
  document.body.classList.toggle('en-chat', tab === 'asistente');
  document.getElementById('escribir')?.remove();
  v.innerHTML = { notas: vistaNotas, productos: vistaProductos, calcular: vistaCalcular, locales: vistaLocales, asistente: vistaAsistente }[tab]();
  if (tab === 'calcular') conectarCalculadora();
  if (tab === 'asistente') conectarChat();
  const b = v.querySelector('.buscar');
  if (b) { b.oninput = () => { filtro = b.value; const p = b.selectionStart; dibujar(); const nb = document.querySelector('.buscar'); nb.focus(); nb.setSelectionRange(p, p); }; }
}

function coincide(...campos) {
  const f = filtro.trim().toLowerCase();
  return !f || campos.some(c => String(c || '').toLowerCase().includes(f));
}
const cajaBuscar = ph => `<input class="buscar" type="search" placeholder="${ph}" value="${esc(filtro)}">`;

/* ---------- Notas ---------- */
let subNotas = 'notas';
function pestanasNotas() {
  return `<div class="segmento"><button class="${subNotas === 'notas' ? 'activo' : ''}" onclick="subNotas='notas';filtro='';dibujar()">📝 Notas</button>
    <button class="${subNotas === 'gastos' ? 'activo' : ''}" onclick="subNotas='gastos';filtro='';dibujar()">🛒 Gastos casa</button></div>`;
}
function vistaNotas() {
  if (subNotas === 'gastos') return pestanasNotas() + vistaGastos();
  const lista = datos.notas.filter(n => coincide(n.texto));
  return `${pestanasNotas()}<button class="grande" onclick="editarNota()">+ Anotar algo</button>
    ${datos.notas.length > 3 ? cajaBuscar('Buscar en las notas…') : ''}
    ${lista.length ? lista.map(n => `<div class="nota" onclick="this.classList.toggle('abierta')">
      <p>${esc(n.texto)}</p>
      <div class="nota-pie"><span>${fecha(n.fecha)}${n.gasto ? ' · 🛒 en gastos' : ''}</span>
        <button class="mini" onclick="event.stopPropagation();editarNota('${n.id}')" aria-label="Cambiar">✏️</button>
        <button class="mini" onclick="event.stopPropagation();borrar('notas','${n.id}')" aria-label="Borrar">🗑️</button></div></div>`).join('')
      : `<p class="vacio">Acá anotás lo que quieras: ideas, precios que viste, la lista del súper…</p>`}
    ${pie()}`;
}
function editarNota(nid) {
  const n = datos.notas.find(x => x.id === nid) || { texto: '' };
  abrir(`<h2>${nid ? 'Cambiar nota' : 'Nueva nota'}</h2>
    <textarea name="texto" required autofocus placeholder="Escribí acá…">${esc(n.texto)}</textarea>
    <button class="grande" value="ok">Guardar</button><button type="button" style="width:100%" onclick="cerrar()">Cancelar</button>`,
    f => {
      let nota = n;
      if (nid) n.texto = f.texto; else { nota = { id: id(), texto: f.texto, fecha: Date.now() }; datos.notas.unshift(nota); }
      setTimeout(() => ofrecerGasto(nota), 300);
    });
}

/* ---------- Gastos casa ---------- */
const PALABRAS_SUPER = /\b(leche|pan|arroz|fideos?|aceite|yerba|az[uú]car|harina|huevos?|queso|manteca|yogur|carne|pollo|milanesas?|papas?|cebollas?|tomates?|lechuga|frutas?|verduras?|bananas?|manzanas?|naranjas?|caf[eé]|t[eé]|galletitas?|gaseosa|agua|jugo|vino|cerveza|sal|mayonesa|detergente|lavandina|jab[oó]n|shampoo|papel higi[eé]nico|rollo de cocina|servilletas?|pa[nñ]ales|dulce de leche|mermelada|at[uú]n|salchichas?|jam[oó]n|fiambre|polenta|lentejas|choclo|caldo|pur[eé]|galletas?|facturas?)\b/gi;
const TIPOS_GASTO = ['Supermercado', 'Verdulería', 'Carnicería', 'Almacén', 'Servicios (luz, gas, internet)', 'Tarjeta de crédito', 'Farmacia', 'Otros'];
const ICONO_TIPO = { 'Supermercado': '🛒', 'Verdulería': '🥬', 'Carnicería': '🥩', 'Almacén': '🏪', 'Servicios (luz, gas, internet)': '💡', 'Tarjeta de crédito': '💳', 'Farmacia': '💊', 'Otros': '🧾' };
// Devuelve el tipo de gasto que parece ser la nota, o '' si no parece un gasto de la casa.
function tipoDeGasto(texto) {
  const t = String(texto || '');
  if (/\b(tarjeta|visa|mastercard|amex|naranja|resumen de cuenta|cuotas?)\b/i.test(t)) return 'Tarjeta de crédito';
  if (/\b(luz|gas|internet|edenor|edesur|metrogas|naturgy|aysa|wifi|cable|telecentro|fibertel|expensas|abl|factura de)\b/i.test(t)) return 'Servicios (luz, gas, internet)';
  if (/\b(verduler[ií]a|verdu)\b/i.test(t)) return 'Verdulería';
  if (/\b(carnicer[ií]a)\b/i.test(t)) return 'Carnicería';
  if (/\b(almac[eé]n|chino|kiosco)\b/i.test(t)) return 'Almacén';
  if (/\b(farmacia|remedios?|ibuprofeno|paracetamol)\b/i.test(t)) return 'Farmacia';
  if (/\b(s[uú]per|supermercado|lista de (las )?compras|mercader[ií]a para la casa)\b/i.test(t)) return 'Supermercado';
  const renglones = t.split(/\n|,/).map(s => s.trim()).filter(Boolean);
  return renglones.length >= 3 && (t.match(PALABRAS_SUPER) || []).length >= 2 ? 'Supermercado' : '';
}
// Suma los precios que aparezcan en la lista ("leche $1.500", "pan 2300").
function sumarPrecios(texto) {
  let total = 0;
  for (const r of String(texto || '').split(/\n|,(?!\d)/)) {
    const m = r.match(/\$\s*([\d.]+(?:,\d+)?)|(?:^|\s)([\d.]{3,}(?:,\d+)?)\s*$/);
    if (m) total += num(m[1] || m[2]);
  }
  return total;
}
async function ofrecerGasto(nota) {
  const tipo = nota && !nota.gasto && !nota.noGasto ? tipoDeGasto(nota.texto) : '';
  if (!tipo) return;
  const si = await cartel(`${ICONO_TIPO[tipo]} ¿Esto es una compra o un gasto de la casa? ¿Lo agrego a Gastos casa? Así te voy sumando todo.`, { si: 'Sí, agregar', no: 'No', frida: true });
  if (!si) { nota.noGasto = true; guardar(); return; }
  editarGasto(null, { tipo, lista: nota.texto, monto: sumarPrecios(nota.texto) || '', notaId: nota.id });
}
const mesDe = t => new Date(t).toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });
function vistaGastos() {
  const ahora = new Date(), esteMes = g => { const d = new Date(g.fecha); return d.getMonth() === ahora.getMonth() && d.getFullYear() === ahora.getFullYear(); };
  const delMes = datos.gastos.filter(esteMes);
  const total = delMes.reduce((s, g) => s + num(g.monto), 0), pagado = delMes.filter(g => g.pagado).reduce((s, g) => s + num(g.monto), 0);
  const sumaTipo = {};
  delMes.forEach(g => { const t = g.tipo || 'Otros'; sumaTipo[t] = (sumaTipo[t] || 0) + num(g.monto); });
  const porTipo = Object.entries(sumaTipo).sort((a, b) => b[1] - a[1]);
  const anteriores = {};
  datos.gastos.filter(g => !esteMes(g)).forEach(g => { const k = mesDe(g.fecha); anteriores[k] = (anteriores[k] || 0) + num(g.monto); });
  const tarjeta = g => `<div class="nota gasto ${g.pagado ? '' : 'pendiente'}">
    <div class="fila" style="justify-content:space-between"><b>${ICONO_TIPO[g.tipo] || '🧾'} ${esc((g.tipo || 'Otros').split(' (')[0])}${g.descripcion ? ` · <span class="suave">${esc(g.descripcion)}</span>` : ''}</b><b>${g.monto ? plata(num(g.monto)) : '$ ?'}</b></div>
    ${g.lista ? `<p class="lista-gasto" onclick="this.classList.toggle('abierta')">${esc(g.lista)}</p>` : ''}
    <div class="nota-pie"><span>${fecha(g.fecha)} · ${g.pagado ? '<span class="verde">✓ Pagado</span>' : '<span class="rojo">Falta pagar</span>'}</span>
      ${g.pagado ? '' : `<button class="mini texto" onclick="pagarGasto('${g.id}')">✓ Ya pagué</button>`}
      <button class="mini" onclick="editarGasto('${g.id}')" aria-label="Cambiar">✏️</button>

const CLAVE_CHARLAS = CLAVE + '-charlas', CLAVE_CODIGO = CLAVE + '-codigo';
// Cada charla guarda sus mensajes; `chat` apunta a los mensajes de la charla abierta.
let charlas = (() => {
  try {
    const c = JSON.parse(localStorage.getItem(CLAVE_CHARLAS));
    if (Array.isArray(c)) return c;
    const vieja = JSON.parse(localStorage.getItem(CLAVE + '-chat'));
    if (Array.isArray(vieja) && vieja.length) return [{ id: id(), titulo: '', fecha: Date.now(), mensajes: vieja }];
  } catch {}
  return [];
})();
if (!charlas.length) charlas.push({ id: id(), titulo: '', fecha: Date.now(), mensajes: [] });
let actual = charlas[0].id;
let chat = charlas[0].mensajes;
let verCharlas = false;
let esperando = false;
function codigo() { try { return localStorage.getItem(CLAVE_CODIGO) || ''; } catch { return ''; } }
(() => {
  const c = new URLSearchParams(location.hash.slice(1)).get('codigo');
  if (!c) return;
  try { localStorage.setItem(CLAVE_CODIGO, c); } catch {}
  history.replaceState(null, '', location.pathname + location.search);
})();
const tituloDe = c => c.titulo || (c.mensajes.find(m => m.rol === 'user')?.texto || 'Charla nueva').slice(0, 60);
function guardarChat() {
  for (const c of charlas) if (c.mensajes.length > 60) c.mensajes.splice(0, c.mensajes.length - 60);
  charlas = charlas.filter(c => c.mensajes.length || c.id === actual);
  try { localStorage.setItem(CLAVE_CHARLAS, JSON.stringify(charlas)); localStorage.removeItem(CLAVE + '-chat'); } catch {}
}
function abrirCharla(cid) {
  const c = charlas.find(x => x.id === cid);
  if (!c) return;
  actual = c.id; chat = c.mensajes; verCharlas = false;
  guardarChat(); dibujar(); scrollTo(0, document.body.scrollHeight);
}
function nuevaCharla() {
  const vacia = charlas.find(c => !c.mensajes.length);
  if (vacia) return abrirCharla(vacia.id);
  const c = { id: id(), titulo: '', fecha: Date.now(), mensajes: [] };
  charlas.unshift(c); abrirCharla(c.id);
}
async function renombrarCharla(cid) {
  const c = charlas.find(x => x.id === cid);
  const nombre = await pedirTexto('¿Qué nombre le ponés a esta charla?', tituloDe(c));
  if (nombre == null || !nombre.trim()) return;
  c.titulo = nombre.trim().slice(0, 60); guardarChat(); dibujar();
}
async function borrarCharla(cid) {
  if (!await preguntar('¿Borrar esta charla? No se puede recuperar.', 'Borrar', true)) return;
  charlas = charlas.filter(c => c.id !== cid);
  if (!charlas.length) charlas.push({ id: id(), titulo: '', fecha: Date.now(), mensajes: [] });
  if (cid === actual) { actual = charlas[0].id; chat = charlas[0].mensajes; }
  guardarChat(); dibujar();
}
function vistaCharlas() {
  const lista = [...charlas].filter(c => c.mensajes.length).sort((a, b) => b.fecha - a.fecha);
  return `<div class="barra-charlas"><button onclick="verCharlas=false;dibujar()">← Volver</button><button onclick="nuevaCharla()">+ Charla nueva</button></div>
    ${lista.length ? lista.map(c => `<div class="tarjeta charla ${c.id === actual ? 'actual' : ''}">
      <h3>${esc(tituloDe(c))}</h3>
      <p>${fecha(c.fecha)} · ${(n => n === 1 ? '1 pregunta' : n + ' preguntas')(c.mensajes.filter(m => m.rol === 'user').length)}</p>
      <div class="fila fin">
        <button class="chico" onclick="abrirCharla('${c.id}')">Abrir</button>
        <button class="chico" onclick="renombrarCharla('${c.id}')">Cambiar nombre</button>
        <button class="chico borrar" onclick="borrarCharla('${c.id}')">Borrar</button></div></div>`).join('')
      : '<p class="vacio">Todavía no tenés charlas guardadas.</p>'}`;
}

function conectarChat() {
  if (!codigo() || verCharlas) return;
  const caja = document.createElement('div');
  caja.className = 'escribir'; caja.id = 'escribir';
  const voz = window.SpeechRecognition || window.webkitSpeechRecognition;
  caja.innerHTML = `<div><textarea id="pregunta" rows="1" placeholder="Escribí tu pregunta…"></textarea>
    ${voz ? '<button class="mic" id="mic" title="Hablar">🎤</button>' : ''}
    <button class="enviar" id="btnEnviar" title="Enviar">➤</button></div>`;
  document.body.appendChild(caja);
  caja.style.bottom = document.getElementById('menu').offsetHeight + 'px';
  const t = document.getElementById('pregunta');
  t.oninput = () => { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; };
  document.getElementById('btnEnviar').onclick = () => { if (t.value.trim()) enviar(t.value); };
  if (voz) {
    const mic = document.getElementById('mic');
    mic.onclick = () => {
      const r = new voz(); r.lang = 'es-AR'; r.interimResults = true;
      const antes = t.value ? t.value + ' ' : '';
      r.onresult = e => { t.value = antes + [...e.results].map(x => x[0].transcript).join(''); t.oninput(); };
      r.onend = () => mic.classList.remove('grabando');
      r.onerror = () => mic.classList.remove('grabando');
      mic.classList.add('grabando'); r.start();
    };
  }
  scrollTo(0, document.body.scrollHeight);
}

function contexto() {
  const l = id => datos.locales.find(x => x.id === id)?.nombre;
  const prods = datos.productos.map(p => {
    const c = cuentas(p.bulto, p.unidades, p.venta);
    return `- ${p.nombre}${p.comprado ? ' (ya comprado)' : ' (lo busca)'}` +
      (c.hay ? `: bulto ${plata(num(p.bulto))}, ${c.u} unidades, cada una ${plata(c.costo)}` : '') +
      (c.v ? `, la vende a ${plata(c.v)} (gana ${plata(c.ganUnidad)} c/u, ${Math.round(c.porc)}%)` : '') +
      (l(p.local) ? `, se compra en ${l(p.local)}` : '') + (p.nota ? `. Nota: ${p.nota}` : '');
  });
  const locs = datos.locales.map(x => `- ${x.nombre}` + [x.vende && 'vende ' + x.vende, x.direccion, x.telefono && 'tel ' + x.telefono, x.nota].filter(Boolean).map(s => ', ' + s).join(''));
  const notas = datos.notas.slice(0, 30).map(n => `- (${fecha(n.fecha)}) ${n.texto}`);
  const gastos = datos.gastos.slice(0, 40).map(g => `- (${fecha(g.fecha)}) ${g.tipo || 'Otros'}${g.descripcion ? ' · ' + g.descripcion : ''}: ${g.monto ? plata(num(g.monto)) : 'monto sin anotar'}, ${g.pagado ? 'pagado' : 'falta pagar'}`);
  return `PRODUCTOS:\n${prods.join('\n') || '(ninguno)'}\n\nLOCALES:\n${locs.join('\n') || '(ninguno)'}\n\nNOTAS:\n${notas.join('\n') || '(ninguna)'}\n\nGASTOS CASA (los más nuevos primero):\n${gastos.join('\n') || '(ninguno)'}`;
}

async function enviar(txt) {
  txt = txt.trim();
  if (!txt || esperando) return;
  const charla = charlas.find(c => c.id === actual), msjs = charla.mensajes;
  const historial = msjs.slice(-16).map(m => ({ rol: m.rol, texto: m.texto }));
  msjs.push({ rol: 'user', texto: txt }); charla.fecha = Date.now(); guardarChat();
  esperando = true; dibujar(); scrollTo(0, document.body.scrollHeight);
  const t0 = Date.now();
  const reloj = setInterval(() => {
    const p = document.getElementById('pensando');
    if (p) p.textContent = ESTADOS[Math.min(ESTADOS.length - 1, Math.floor((Date.now() - t0) / 5000))];
  }, 1000);
  let resp;
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accion: 'preguntar', codigo: codigo(), mensaje: txt, historial, contexto: contexto() }) });
    const d = await r.json();
    if (r.status === 401) resp = { texto: 'No me puedo conectar: el link especial no es válido. Pedile a Daniela uno nuevo.' };
    else if (d.error === 'ocupado') resp = { texto: 'Estoy con mucha gente en este momento. Probá de nuevo en un minuto, por favor.' };
    else if (d.error || (!d.texto && !d.acciones?.length)) resp = { texto: 'Uy, algo falló. Probá preguntarme de nuevo.' };
    else resp = { texto: d.texto || 'Te dejo esto para guardar:', acciones: d.acciones || [],
      busquedas: (d.busquedas || []).filter(b => b.consulta).map(b => ({ consulta: b.consulta, fuentes: (b.fuentes || []).filter(u => /^https?:\/\//.test(u)) })) };
  } catch { resp = { texto: 'No hay internet o no me pude conectar. Probá de nuevo en un rato.' }; }
  clearInterval(reloj);
  esperando = false;
  msjs.push({ rol: 'assistant', ...resp }); charla.fecha = Date.now(); guardarChat();
  if (tab === 'asistente' && !verCharlas && charla.id === actual) {
    programarToc(); dibujar(); document.querySelectorAll('.msj.asis')[chat.filter(m => m.rol === 'assistant').length - 1]?.scrollIntoView({ block: 'start' }); }
}

// Toc toc: si después de una respuesta pasan 10 segundos sin que toque ni escriba nada, Frida golpea la pantalla una vez.
let timerToc = null;
function programarToc() {
  clearTimeout(timerToc);
  const cancelar = () => { clearTimeout(timerToc); ['pointerdown', 'keydown'].forEach(ev => removeEventListener(ev, cancelar, true)); };
  ['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, cancelar, true));
  timerToc = setTimeout(() => { cancelar(); if (tab === 'asistente' && !document.hidden) tocToc(); }, 10000);
}
function tocToc() {
  document.body.classList.remove('golpe'); void document.body.offsetWidth; document.body.classList.add('golpe');
  try { navigator.vibrate?.([45, 110, 45]); } catch {}
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.17].forEach(t => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(190, ac.currentTime + t); o.frequency.exponentialRampToValueAtTime(70, ac.currentTime + t + 0.09);
      g.gain.setValueAtTime(0.0001, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(0.8, ac.currentTime + t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.12);
      o.connect(g).connect(ac.destination); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.13);
    });
    setTimeout(() => ac.close(), 600);
  } catch {}
  document.getElementById('toc')?.remove();
  const b = document.createElement('div');
  b.id = 'toc'; b.className = 'toc';
  b.innerHTML = '<img src="frida.svg" alt=""><span>¡Toc toc! 👋 ¿Seguís ahí?</span>';
  b.style.bottom = ((document.getElementById('escribir')?.offsetHeight || 0) + document.getElementById('menu').offsetHeight + 10) + 'px';
  b.onclick = () => { b.remove(); document.getElementById('pregunta')?.focus(); };
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 5000);
}

const sitio = u => { try { const x = new URL(u); return x.hostname.replace(/^www\./, '') + (x.pathname.length > 1 ? x.pathname.slice(0, 40) : ''); } catch { return u; } };
const plataSimple =n => n ? plata(Number(n)) : '';
function describir(a) {
  if (a.accion === 'agregar_nota') return `Nota: "${a.texto}"`;
  if (a.accion === 'agregar_local') return `Local: ${a.nombre}${a.vende ? ' — ' + a.vende : ''}${a.direccion ? ' — ' + a.direccion : ''}${a.telefono ? ' — tel ' + a.telefono : ''}`;
  if (a.accion === 'marcar_comprado') return `Marcar "${a.nombre}" como ya comprado`;
  if (a.accion === 'agregar_gasto') return `${ICONO_TIPO[a.tipo] || '🧾'} ${a.tipo || 'Otros'}${a.detalle ? ' · ' + a.detalle : ''}: ${a.monto ? plataSimple(a.monto) : 'monto a completar'} · ${a.pagado ? 'ya pagado' : 'falta pagar'}`;
  if (a.accion === 'marcar_gasto_pagado') return `Marcar como pagado: ${a.tipo || ''}${a.detalle ? ' · ' + a.detalle : ''}`;
  if (a.accion === 'agregar_producto') return `Producto: ${a.nombre}` + [a.bulto && 'bulto ' + plataSimple(a.bulto), a.unidades && a.unidades + ' unidades', a.venta && 'lo vendés a ' + plataSimple(a.venta), a.local && 'en ' + a.local].filter(Boolean).map(s => ' · ' + s).join('');
  return '';
}
const buscarPorNombre = (lista, n) => { const k = String(n || '').trim().toLowerCase(); return lista.find(x => x.nombre.toLowerCase() === k) || lista.find(x => x.nombre.toLowerCase().includes(k) || k.includes(x.nombre.toLowerCase())); };
const str = v => v == null ? '' : String(v);
function aplicar(i, j) {
  const a = chat[i].acciones[j];
  let hecho = '';
  if (a.accion === 'agregar_nota') {
    const nota = { id: id(), texto: str(a.texto), fecha: Date.now() };
    datos.notas.unshift(nota); hecho = 'Nota guardada';
    // Si Frida ya propuso el gasto en el mismo mensaje, no se pregunta dos veces.
    if (chat[i].acciones.some(x => x.accion === 'agregar_gasto')) nota.noGasto = true;
    else setTimeout(() => ofrecerGasto(nota), 300);
  }
  else if (a.accion === 'agregar_gasto') {
    datos.gastos.unshift({ id: id(), fecha: Date.now(), tipo: TIPOS_GASTO.includes(a.tipo) ? a.tipo : 'Otros', descripcion: str(a.detalle), monto: a.monto ? str(a.monto) : '', lista: str(a.lista), pagado: !!a.pagado });
    hecho = 'Agregado a Gastos casa';
  } else if (a.accion === 'marcar_gasto_pagado') {
    const k = s => String(s || '').toLowerCase();
    const g = datos.gastos.find(x => !x.pagado && (!a.tipo || x.tipo === a.tipo) && (!a.detalle || k(x.descripcion).includes(k(a.detalle)) || k(a.detalle).includes(k(x.descripcion))));
    if (!g) { avisar('No encontré ese gasto pendiente.'); return; }
    g.pagado = true; hecho = `${g.tipo}${g.descripcion ? ' · ' + g.descripcion : ''} marcado como pagado`;
  }
  else if (a.accion === 'agregar_local') {
    datos.locales.unshift({ id: id(), nombre: str(a.nombre), vende: str(a.vende), direccion: str(a.direccion), telefono: str(a.telefono), nota: str(a.nota) }); hecho = 'Local anotado';
  } else if (a.accion === 'agregar_producto') {
    const loc = a.local ? buscarPorNombre(datos.locales, a.local) : null;
    datos.productos.unshift({ id: id(), comprado: false, nombre: str(a.nombre), bulto: str(a.bulto), unidades: str(a.unidades), venta: str(a.venta), local: loc?.id || '',
      nota: [str(a.nota), a.local && !loc ? 'Local: ' + a.local : ''].filter(Boolean).join('\n') });
    hecho = 'Producto anotado en "Lo que busco"';
  } else if (a.accion === 'marcar_comprado') {
    const p = buscarPorNombre(datos.productos, a.nombre);
    if (!p) { avisar('No encontré ese producto en tu lista.'); return; }
    p.comprado = true; hecho = `"${p.nombre}" marcado como comprado`;
  }
  a.hecha = hecho; guardar(); guardarChat(); dibujar();
}
function descartar(i, j) { chat[i].acciones.splice(j, 1); guardarChat(); dibujar(); }

/* ---------- Comunes ---------- */
// Cartelitos propios: los alert/confirm del navegador muestran la dirección del sitio arriba.
function cartel(texto, { si = 'Aceptar', no = '', peligro = false, campo = null, frida = false } = {}) {
  document.getElementById('avisoFrida').hidden = !frida;
  const d = document.getElementById('aviso'), c = document.getElementById('avisoCampo'), bSi = document.getElementById('avisoSi'), bNo = document.getElementById('avisoNo');
  document.getElementById('avisoTexto').textContent = texto;
  bSi.textContent = si; bSi.classList.toggle('peligro', peligro);
  bNo.textContent = no; bNo.hidden = !no;
  c.hidden = campo == null; c.value = campo ?? '';
  c.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); d.close('si'); } };
  d.returnValue = '';
  d.showModal();
  if (campo != null) { c.focus(); c.select(); }
  return new Promise(ok => d.addEventListener('close', () => ok(d.returnValue === 'si'), { once: true }));
}
const avisar = texto => cartel(texto);
const preguntar = (texto, si = 'Sí', peligro = false) => cartel(texto, { si, no: 'Cancelar', peligro });
async function pedirTexto(texto, valor) {
  return await cartel(texto, { si: 'Guardar', no: 'Cancelar', campo: valor }) ? document.getElementById('avisoCampo').value : null;
}
let alGuardar = null;
function abrir(html, cb) {
  const m = document.getElementById('modal'), f = document.getElementById('formModal');
  f.innerHTML = html; alGuardar = cb; m.showModal();
}
function cerrar() { document.getElementById('modal').close(); }
document.getElementById('formModal').onsubmit = e => {
  const valores = Object.fromEntries(new FormData(e.target));
  for (const k in valores) valores[k] = valores[k].trim();
  if (alGuardar) alGuardar(valores);
  alGuardar = null; guardar(); dibujar();
};
async function borrar(lista, x) {
  if (!await preguntar('¿Seguro que lo querés borrar?', 'Borrar', true)) return;
  datos[lista] = datos[lista].filter(i => i.id !== x);
  if (lista === 'locales') datos.productos.forEach(p => { if (p.local === x) p.local = ''; });
  if (lista === 'gastos') datos.notas.forEach(n => { if (n.gasto === x) delete n.gasto; });
  guardar(); dibujar();
}

function pie() {
  return `<div class="pie">Todo se guarda en este teléfono.<br>
    <button onclick="exportar()">Guardar copia</button><button onclick="document.getElementById('archivo').click()">Recuperar copia</button></div>`;
}
function exportar() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(datos, null, 1)], { type: 'application/json' }));
  a.download = 'mis-compras-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById('archivo').onchange = async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!await preguntar('Esto reemplaza lo que tenés ahora por la copia. ¿Seguir?', 'Seguir')) return;
    datos = { notas: d.notas || [], productos: d.productos || [], locales: d.locales || [], gastos: d.gastos || [] };
    guardar(); dibujar();
  } catch { avisar('Ese archivo no es una copia válida.'); }
};

document.querySelectorAll('#menu button').forEach(b => b.onclick = () => cambiarTab(b.dataset.tab));
dibujar();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
